# Local dev for ZoidLab SpendGuard (Foundry Package 07).
#   docker compose up --build
# Self-contained: Postgres comes up first and ./initdb.sql creates the RLS roles
# (foundry owns the schema, app_rls is the NOBYPASSRLS role every request runs as),
# then the backend opens its psycopg pool against it at import. Point
# DATABASE_URL / DATABASE_URL_ADMIN elsewhere to use the shared Foundry Postgres.
# Note: the backend image binds SpendGuard's canonical 8701 inside the container and the
# frontend's `next start -p 3701` fixes its port at 3701, so both map 1:1 to the host.
services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_rls:app_rls@postgres:5432/spendguard}
      - DATABASE_URL_ADMIN=${DATABASE_URL_ADMIN:-postgresql://foundry:foundry@postgres:5432/spendguard}
      - BUILDER_SESSION_SECRET=${BUILDER_SESSION_SECRET:-change-me}
      - NYQUEST_API_KEY=${NYQUEST_API_KEY:-}
      - FOUNDRY_GATE_ENABLED=${FOUNDRY_GATE_ENABLED:-true}
      - FOUNDRY_REQUIRED_PLAN=${FOUNDRY_REQUIRED_PLAN:-pro}
      - MOCK_PRO_USER=${MOCK_PRO_USER:-false}
      - SPENDGUARD_ADMINS=${SPENDGUARD_ADMINS:-}
    ports:
      - "8701:8701"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - SPENDGUARD_API_URL=http://backend:8701
      - BUILDER_SESSION_SECRET=${BUILDER_SESSION_SECRET:-change-me}
      - NYQUEST_API=${NYQUEST_API:-https://api.nyquest.ai}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-.zoidlab.ai}
    ports:
      - "3701:3701"
    depends_on:
      - backend

  # Not published to the host: the backend reaches it over the compose network, so
  # `docker compose up` never collides with a Postgres already running locally.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=foundry
      - POSTGRES_PASSWORD=foundry
      - POSTGRES_DB=spendguard
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/10-foundry-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U foundry -d spendguard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
